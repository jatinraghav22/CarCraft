[project]
name = "carcraft-backend"
version = "0.1.0"
description = "CarCraft Django REST API"
requires-python = ">=3.10"
dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.18.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "python-dotenv==1.2.3",
    "Pillow==12.3.0",
    "PyJWT==2.15.1",
    "asgiref==3.12.1",
    "sqlparse==0.6.0",
    "tzdata==2026.4",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.9",
    "dj-database-url>=2.3.0",
    "whitenoise>=6.9.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
mysql = ["mysqlclient==2.3.0"]

[tool.uv]
package = false
