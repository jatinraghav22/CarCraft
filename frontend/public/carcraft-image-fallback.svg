<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <!-- Lime Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bef264" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#bef264" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#bef264" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <ellipse cx="400" cy="250" rx="360" ry="220" fill="url(#glow)" />

  <!-- Outer Framing -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 36 60 L 36 36 L 60 36" fill="none" stroke="#bef264" stroke-width="2" stroke-linecap="round" />
  <path d="M 764 60 L 764 36 L 740 36" fill="none" stroke="#bef264" stroke-width="2" stroke-linecap="round" />
  <path d="M 36 440 L 36 464 L 60 464" fill="none" stroke="#bef264" stroke-width="2" stroke-linecap="round" />
  <path d="M 764 440 L 764 464 L 740 464" fill="none" stroke="#bef264" stroke-width="2" stroke-linecap="round" />

  <!-- Center Vehicle Silhouette / Monogram -->
  <g transform="translate(400, 215)">
    <!-- Aerodynamic Supercar Silhouette -->
    <path d="M -110 32 
             C -95 18, -70 12, -45 6 
             C -25 -10, 10 -18, 50 -14
             C 85 -10, 115 6, 130 20
             C 135 25, 138 32, 138 32
             L -110 32 Z" 
          fill="none" stroke="#bef264" stroke-width="2" stroke-linejoin="round" />

    <!-- Wheels Outline -->
    <circle cx="-65" cy="32" r="14" fill="#07090e" stroke="#bef264" stroke-width="2" />
    <circle cx="-65" cy="32" r="6" fill="#bef264" opacity="0.6" />

    <circle cx="90" cy="32" r="14" fill="#07090e" stroke="#bef264" stroke-width="2" />
    <circle cx="90" cy="32" r="6" fill="#bef264" opacity="0.6" />

    <!-- Chassis Ground Line -->
    <line x1="-135" y1="36" x2="155" y2="36" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- Typography -->
  <text x="400" y="315" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="19" font-weight="800" letter-spacing="6">
    CARCRAFT
  </text>
  <text x="400" y="338" text-anchor="middle" fill="#bef264" font-family="'Space Grotesk', monospace" font-size="10" font-weight="600" letter-spacing="3">
    ATELIER TELEMETRY // MEDIA ASSET SYNC
  </text>
</svg>
