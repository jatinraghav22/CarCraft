<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customer - CarCraft</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    {% include 'includes/style_link.html' %}
</head>

<body class="app-page">
{% include 'includes/app_chrome.html' %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header">
                    <h4>
                        {% if customer %}
                            Edit Customer
                        {% else %}
                            Add Customer
                        {% endif %}
                    </h4>
                </div>

                <div class="card-body">

                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            <strong>Please correct the following:</strong>
                            {{ form.errors }}
                        </div>
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>

                            <input type="text"
                                   name="full_name"
                                   class="form-control"
                                   value="{{ form.full_name.value|default:'' }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   value="{{ form.email.value|default:'' }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>

                            <input type="text"
                                   name="phone"
                                   class="form-control"
                                   inputmode="tel"
                                   autocomplete="tel"
                                   value="{{ form.phone.value|default:'' }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>

                            <textarea name="address"
                                      class="form-control"
                                      rows="4">{{ form.address.value|default:'' }}</textarea>
                        </div>

                        <button type="submit"
                                class="btn btn-primary">

                            {% if customer %}
                                Update Customer
                            {% else %}
                                Add Customer
                            {% endif %}

                        </button>

                        <a href="{% url 'customer_list' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
