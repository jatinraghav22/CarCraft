<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Delete Vehicle - CarCraft</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    {% include 'includes/style_link.html' %}
</head>

<body class="app-page">
{% include 'includes/app_chrome.html' %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body text-center">

            <h3 class="text-danger">Delete Vehicle</h3>

            <p>Are you sure you want to delete:</p>

            <h5>{{ vehicle.year }} {{ vehicle.make }} {{ vehicle.model }}</h5>

            <p class="text-muted">
                VIN: {{ vehicle.vin }}
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'vehicle_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
