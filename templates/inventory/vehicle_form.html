<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if vehicle %}Edit Vehicle{% else %}Add Vehicle{% endif %}
        - CarCraft
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    {% include 'includes/style_link.html' %}
</head>

<body class="app-page">
{% include 'includes/app_chrome.html' %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header">
                    <h4 class="mb-0">
                        {% if vehicle %}
                            Edit Vehicle
                        {% else %}
                            Add Vehicle
                        {% endif %}
                    </h4>
                </div>

                <div class="card-body">

                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            <strong>Please correct the following:</strong>
                            {{ form.errors }}
                        </div>
                    {% endif %}

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Make</label>
                                <input type="text"
                                       name="make"
                                       class="form-control"
                                       value="{{ form.make.value|default:'' }}"
                                       placeholder="Toyota"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Model</label>
                                <input type="text"
                                       name="model"
                                       class="form-control"
                                       value="{{ form.model.value|default:'' }}"
                                       placeholder="Corolla"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Year</label>
                                <input type="number"
                                       name="year"
                                       class="form-control"
                                       min="1886"
                                       value="{{ form.year.value|default:'' }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">VIN</label>
                                <input type="text"
                                       name="vin"
                                       class="form-control"
                                       maxlength="17"
                                       value="{{ form.vin.value|default:'' }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Color</label>
                                <input type="text"
                                       name="color"
                                       class="form-control"
                                       value="{{ form.color.value|default:'' }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price</label>
                                <input type="number"
                                       name="price"
                                       class="form-control"
                                       min="0.01"
                                       step="0.01"
                                       value="{{ form.price.value|default:'' }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mileage</label>
                                <input type="number"
                                       name="mileage"
                                       class="form-control"
                                       min="0"
                                       value="{{ form.mileage.value|default:0 }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status</label>

                                <select name="status" class="form-select" required>

                                    <option value="available"
                                        {% if form.status.value == 'available' %}selected{% endif %}>
                                        Available
                                    </option>

                                    <option value="reserved"
                                        {% if form.status.value == 'reserved' %}selected{% endif %}>
                                        Reserved
                                    </option>

                                    <option value="sold"
                                        {% if form.status.value == 'sold' %}selected{% endif %}>
                                        Sold
                                    </option>

                                    <option value="delivered"
                                        {% if form.status.value == 'delivered' %}selected{% endif %}>
                                        Delivered
                                    </option>

                                </select>

                            </div>

                            <div class="col-12 mb-3">
                                <label for="vehicle-image" class="form-label">Vehicle Photo</label>
                                {% if vehicle.image %}
                                    <div class="mb-2">
                                        <img src="{{ vehicle.image.url }}" alt="Current photo of {{ vehicle.make }} {{ vehicle.model }}" class="img-thumbnail" style="max-height: 180px;">
                                    </div>
                                {% endif %}
                                <input
                                    id="vehicle-image"
                                    type="file"
                                    name="image"
                                    class="form-control"
                                    accept="image/*"
                                >
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary">
                            {% if vehicle %}
                                Update Vehicle
                            {% else %}
                                Add Vehicle
                            {% endif %}
                        </button>

                        <a href="{% url 'vehicle_list' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
