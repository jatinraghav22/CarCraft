<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Delete Part - CarCraft</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% include 'includes/style_link.html' %}
</head>

<body class="app-page">
{% include 'includes/app_chrome.html' %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3 class="text-danger">
                        Delete Part
                    </h3>

                    <p class="mt-3">
                        Are you sure you want to delete:
                    </p>

                    <h5>
                        {{ part.name }}
                    </h5>

                    <p class="text-muted">
                        SKU: {{ part.sku }}
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Yes, Delete
                        </button>

                        <a
                            href="{% url 'part_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
