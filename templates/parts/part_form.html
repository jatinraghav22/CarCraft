<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if part %}
            Edit Part
        {% else %}
            Add Part
        {% endif %}
        - CarCraft
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% include 'includes/style_link.html' %}
</head>

<body class="app-page">
{% include 'includes/app_chrome.html' %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header">

                    <h4 class="mb-0">

                        {% if part %}
                            Edit Part
                        {% else %}
                            Add Part
                        {% endif %}

                    </h4>

                </div>

                <div class="card-body">

                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            <strong>Please correct the following:</strong>
                            {{ form.errors }}
                        </div>
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}


                        <!-- Part Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Part Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ form.name.value|default:'' }}"
                                placeholder="Example: Brake Pad"
                                required
                            >

                        </div>


                        <!-- SKU -->

                        <div class="mb-3">

                            <label class="form-label">
                                SKU
                            </label>

                            <input
                                type="text"
                                name="sku"
                                class="form-control"
                                value="{{ form.sku.value|default:'' }}"
                                placeholder="Example: BP001"
                                required
                            >

                        </div>


                        <!-- Category -->

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <input
                                type="text"
                                name="category"
                                class="form-control"
                                value="{{ form.category.value|default:'' }}"
                                placeholder="Example: Brakes"
                                required
                            >

                        </div>


                        <!-- Price -->

                        <div class="mb-3">

                            <label class="form-label">
                                Price (₹)
                            </label>

                            <input
                                type="number"
                                name="price"
                                class="form-control"
                                value="{{ form.price.value|default:'' }}"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>


                        <!-- Stock -->

                        <div class="mb-3">

                            <label class="form-label">
                                Stock Quantity
                            </label>

                            <input
                                type="number"
                                name="stock_qty"
                                class="form-control"
                                value="{{ form.stock_qty.value|default:'' }}"
                                min="0"
                                required
                            >

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                {% if part %}
                                    Update Part
                                {% else %}
                                    Add Part
                                {% endif %}
                            </button>

                            <a
                                href="{% url 'part_list' %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
