<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Order Part - CarCraft</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

{% include 'includes/style_link.html' %}
</head>


<body class="app-page">
{% include 'includes/app_chrome.html' %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            <strong>Order could not be placed.</strong>
                            {{ form.errors }}
                        </div>
                    {% endif %}

                    <h3 class="mb-4">
                        Order Part
                    </h3>


                    <div class="alert alert-info">

                        <strong>
                            {{ part.name }}
                        </strong>

                        <br>

                        SKU: {{ part.sku }}

                        <br>

                        Current Stock: {{ part.stock_qty }}

                    </div>


                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Quantity
                            </label>

                            <input
                                type="number"
                                name="quantity"
                                class="form-control"
                                min="1"
                                max="{{ part.stock_qty }}"
                                value="{{ form.quantity.value|default:'' }}"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Place Order
                        </button>


                        <a
                            href="{% url 'part_detail' part.id %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
