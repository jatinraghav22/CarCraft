<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sale - CarCraft</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% include 'includes/style_link.html' %}
</head>

<body class="app-page">
{% include 'includes/app_chrome.html' %}

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            CarCraft
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body">

                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            <strong>Please correct the following:</strong>
                            {{ form.errors }}
                        </div>
                    {% endif %}

                    <h3 class="mb-4">

                        {% if sale %}
                            Edit Sale
                        {% else %}
                            Add Sale
                        {% endif %}

                    </h3>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Customer -->

                        <div class="mb-3">

                            <label class="form-label">
                                Customer
                            </label>

                            <select
                                name="customer"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Customer
                                </option>

                                {% for customer in customers %}

                                <option
                                    value="{{ customer.id }}"
                                    {% if form.customer.value|stringformat:"s" == customer.id|stringformat:"s" %}
                                        selected
                                    {% endif %}
                                >

                                    {{ customer.full_name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Vehicle -->

                        <div class="mb-3">

                            <label class="form-label">
                                Vehicle
                            </label>

                            <select
                                name="vehicle"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Vehicle
                                </option>

                                {% for vehicle in vehicles %}

                                <option
                                    value="{{ vehicle.id }}"
                                    {% if form.vehicle.value|stringformat:"s" == vehicle.id|stringformat:"s" %}
                                        selected
                                    {% endif %}
                                >

                                    {{ vehicle.make }}
                                    {{ vehicle.model }}
                                    - {{ vehicle.year }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Amount -->

                        <div class="mb-3">

                            <label class="form-label">
                                Amount
                            </label>

                            <input
                                type="number"
                                name="amount"
                                class="form-control"
                                step="0.01"
                                value="{{ form.amount.value|default:'' }}"
                                required
                            >

                        </div>


                        <!-- Stage -->

                        <div class="mb-3">

                            <label class="form-label">
                                Stage
                            </label>

                            <select
                                name="stage"
                                class="form-select"
                                required
                            >

                                <option
                                    value="inquiry"
                                    {% if form.stage.value == 'inquiry' %}
                                        selected
                                    {% endif %}
                                >
                                    Inquiry
                                </option>

                                <option
                                    value="booking"
                                    {% if form.stage.value == 'booking' %}
                                        selected
                                    {% endif %}
                                >
                                    Booking
                                </option>

                                <option
                                    value="sold"
                                    {% if form.stage.value == 'sold' %}
                                        selected
                                    {% endif %}
                                >
                                    Sold
                                </option>

                                <option
                                    value="delivered"
                                    {% if form.stage.value == 'delivered' %}
                                        selected
                                    {% endif %}
                                >
                                    Delivered
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >

                            {% if sale %}
                                Update Sale
                            {% else %}
                                Add Sale
                            {% endif %}

                        </button>


                        <a
                            href="{% url 'sale_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
