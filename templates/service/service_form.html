<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Service - CarCraft</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% include 'includes/style_link.html' %}
</head>

<body class="app-page">
{% include 'includes/app_chrome.html' %}

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            CarCraft
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body">

                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            <strong>Please correct the following:</strong>
                            {{ form.errors }}
                        </div>
                    {% endif %}

                    <h3 class="mb-4">

                        {% if service %}
                            Edit Service Appointment
                        {% else %}
                            Add Service Appointment
                        {% endif %}

                    </h3>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Customer -->

                        <div class="mb-3">

                            <label class="form-label">
                                Customer
                            </label>

                            <select
                                name="customer"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Customer
                                </option>

                                {% for customer in customers %}

                                <option
                                    value="{{ customer.id }}"
                                    {% if form.customer.value|stringformat:"s" == customer.id|stringformat:"s" %}
                                        selected
                                    {% endif %}
                                >

                                    {{ customer.full_name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Vehicle -->

                        <div class="mb-3">

                            <label class="form-label">
                                Vehicle
                            </label>

                            <select
                                name="vehicle"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Vehicle
                                </option>

                                {% for vehicle in vehicles %}

                                <option
                                    value="{{ vehicle.id }}"
                                    {% if form.vehicle.value|stringformat:"s" == vehicle.id|stringformat:"s" %}
                                        selected
                                    {% endif %}
                                >

                                    {{ vehicle.make }}
                                    {{ vehicle.model }}
                                    - {{ vehicle.year }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Appointment Date -->

                        <div class="mb-3">

                            <label class="form-label">
                                Appointment Date
                            </label>

                            <input
                                type="datetime-local"
                                name="scheduled_for"
                                class="form-control"
                                value="{% if form.is_bound %}{{ form.scheduled_for.value }}{% elif service %}{{ service.scheduled_for|date:'Y-m-d\\TH:i' }}{% endif %}"
                                required
                            >

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Enter service details..."
                                required
                            >{{ form.description.value|default:'' }}</textarea>

                        </div>


                        <!-- Status -->

                        <div class="mb-3">

                            <label class="form-label">
                                Status
                            </label>

                            <select name="status" class="form-select" required>
                                {% for value, label in form.fields.status.choices %}
                                    <option value="{{ value }}" {% if form.status.value == value %}selected{% endif %}>
                                        {{ label }}
                                    </option>
                                {% endfor %}
                            </select>

                        </div>


                        <!-- Cost -->

                        <div class="mb-3">

                            <label class="form-label">
                                Cost
                            </label>

                            <input
                                type="number"
                                name="cost"
                                class="form-control"
                                min="0"
                                step="0.01"
                                value="{{ form.cost.value|default:'' }}"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >

                            {% if service %}
                                Update Service
                            {% else %}
                                Add Service
                            {% endif %}

                        </button>


                        <a
                            href="{% url 'service_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
